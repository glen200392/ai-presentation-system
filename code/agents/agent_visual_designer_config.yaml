  style_guide:
    style_name: "string"
    formality: "formal|semi-formal|casual"
    
    color_palette:
      primary: {hex: "string", rgb: "string", cmyk: "string"}
      secondary: {hex: "string", rgb: "string", cmyk: "string"}
      accent: {hex: "string", rgb: "string", cmyk: "string"}
      background: {hex: "string"}
      text_primary: {hex: "string"}
      text_secondary: {hex: "string"}
      
    typography:
      title_font: "string"
      body_font: "string"
      hierarchy:
        h1: "string"
        h2: "string"
        h3: "string"
        body: "string"
        caption: "string"
        
    grid_layout:
      margins: "string"
      columns: "number"
      gutter: "string"
      
    accessibility:
      wcag_compliant: "boolean"
      contrast_ratios:
        - pair: "primary/background"
          ratio: "number"
          passes: "boolean"
      colorblind_safe: "boolean"
      
    slide_layouts:
      - type: "title|content|data|image|comparison"
        description: "string"
        grid_usage: "string"
        
    image_guidance:
      keywords: ["keyword1", "keyword2"]
      platforms: ["Unsplash", "Pexels"]
      requirements:
        - "resolution ≥ 1920x1080"
        - "brand color alignment"
        
    dos_and_donts:
      dos:
        - "string"
      donts:
        - "string"

quality_standards:
  wcag_compliance: "AA 級以上"
  contrast_ratio: "≥ 4.5:1（正文），≥ 3:1（標題）"
  consistency: "所有元素符合風格指南"
  readability: "字體大小適中，行距舒適"
  visual_hierarchy: "清晰的視覺層次"

available_tools:
  - tool: "python_execution"
    purpose: "調色盤視覺化、對比率計算"
    packages:
      - "matplotlib"
      - "seaborn"

prompt_template: |
  你是 Presentation Visual Designer Agent，專門簡化一致性、品牌化簡報視覺創建。
  
  你的核心任務：
  1. 從 5 種設計風格中選擇最適合的
  2. 生成完整配色方案（HEX, RGB, CMYK）
  3. 設計字型階層（H1-H3、正文、標註）
  4. 建立網格系統（邊距、欄位、間距）
  5. 驗證 WCAG AA 合規性（對比率、色盲友善）
  6. 設計投影片版面框架（標題、文字、圖表、圖片、比較）
  7. 提供圖片來源指引
  8. 生成完整風格指南與 Do's & Don'ts
  
  5 種設計風格：
  - Business Professional：正式、深藍灰、Arial
  - Tech Innovation：現代、科技藍綠、Roboto
  - Creative Energy：活潑、鮮豔多彩、Montserrat
  - Academic Research：嚴謹、深藍酒紅、Times New Roman
  - Minimal Modern：極簡、黑白紅、Helvetica
  
  無障礙標準：
  - 對比率 ≥ 4.5:1（正文）
  - 對比率 ≥ 3:1（標題）
  - 色盲友善調色盤
  - 字體 ≥ 16pt
  
  你的設計將確保簡報視覺專業、一致、無障礙。
