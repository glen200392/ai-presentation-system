core_capabilities:
  - name: "風格指南生成"
    description: "完整的視覺設計系統"
    output_includes:
      - "配色方案（HEX, RGB, CMYK）"
      - "字型階層（標題、正文、標註）"
      - "網格系統（邊距、欄位、間距）"
      - "視覺原則（Do's & Don'ts）"
      - "實施技巧"
    
  - name: "WCAG AA 合規性"
    description: "確保無障礙設計"
    checks:
      - "色彩對比率 ≥ 4.5:1（正文）"
      - "色彩對比率 ≥ 3:1（標題）"
      - "色盲友善調色盤"
      - "字體大小 ≥ 16pt（正文）"
      - "清晰的視覺層次"
    tools:
      - "對比率計算器"
      - "色盲模擬器"
    
  - name: "網格化投影片框架"
    description: "結構化版面系統"
    slide_types:
      - type: "title_slide"
        layout: "置中對齊，大標題 + 副標題"
        grid: "6x4 中央區塊"
        
      - type: "content_slide"
        layout: "標題 + 項目符號或文字"
        grid: "12x8，1 列標題 + 7 列內容"
        
      - type: "data_slide"
        layout: "標題 + 圖表或表格"
        grid: "12x8，1 列標題 + 7 列數據"
        
      - type: "image_slide"
        layout: "全幅圖片 + 標題疊加"
        grid: "12x12 滿版"
        
      - type: "comparison_slide"
        layout: "並排比較（2-3 欄）"
        grid: "12x8，等寬欄位"
    
  - name: "圖片來源指引"
    description: "高品質圖片推薦"
    platforms:
      - name: "Unsplash"
        url: "https://unsplash.com"
        license: "免費商用"
        keywords: "高解析、專業攝影"
        
      - name: "Pexels"
        url: "https://pexels.com"
        license: "免費商用"
        keywords: "影片、照片、向量"
        
      - name: "Pixabay"
        url: "https://pixabay.com"
        license: "免費商用"
        keywords: "插畫、向量圖"
    recommendations:
      - "解析度 ≥ 1920x1080"
      - "符合品牌色調"
      - "避免通用庫存照"
      - "考慮情緒與氛圍"
    
  - name: "Python 驅動的調色盤視覺化"
    description: "自動生成配色預覽"
    tools:
      - "matplotlib - 調色盤展示"
      - "seaborn - 色彩和諧檢查"
    output: "PNG 格式調色盤卡片"
    
  - name: "Do's & Don'ts 指南"
    description: "視覺設計最佳實踐"
    categories:
      - "配色使用"
      - "字型搭配"
      - "版面排列"
      - "圖片選擇"
      - "資訊密度"

design_workflow:
  step_1:
    name: "風格選擇"
    input: "Scenario Intelligence 的風格建議"
    process: "確認 5 種風格中的最佳選擇"
    output: "風格名稱 + 完整配色與字型系統"
    
  step_2:
    name: "調色盤生成"
    input: "風格配置"
    process: "提取主色、副色、強調色、背景色、文字色"
    output: "HEX, RGB, CMYK 完整色碼"
    
  step_3:
    name: "無障礙驗證"
    input: "調色盤"
    process: "計算對比率、色盲模擬"
    output: "WCAG 合規性報告"
    
  step_4:
    name: "字型階層設計"
    input: "風格配置 + 內容需求"
    process: "定義 H1-H3、正文、標註的字型與大小"
    output: "字型規範表"
    
  step_5:
    name: "網格系統建立"
    input: "投影片尺寸（16:9 或 4:3）"
    process: "設定邊距、欄位、間距"
    output: "網格模板"
    
  step_6:
    name: "版面框架設計"
    input: "內容類型（標題、文字、圖表、圖片、比較）"
    process: "為每種類型設計版面"
    output: "投影片版面庫"
    
  step_7:
    name: "圖片推薦"
    input: "內容主題 + 風格"
    process: "生成搜尋關鍵字、推薦平台"
    output: "圖片來源指引"
    
  step_8:
    name: "風格指南文檔"
    input: "所有設計決策"
    process: "整合為完整風格指南"
    output: "風格指南 PDF/Markdown + Do's & Don'ts"

