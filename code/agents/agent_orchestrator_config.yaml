# PowerPoint 簡報生成器 (主控 Agent)
# Agent ID: agt_0697a0226eaf7dc1800093eb8943c2da

agent_metadata:
  name: "PowerPoint 簡報生成器"
  version: "1.0.0"
  type: "orchestrator"
  description: |
    PowerPoint 簡報生成器是一款專業化 AI 助手，專注於從需求分析到 .pptx 檔案交付的全流程自動化。
    它會根據受眾與主題自動生成結構化大綱，並推薦五種設計風格。

design_styles:
  - business_professional: "商務專業"
  - tech_innovation: "科技創新"
  - creative_energy: "創意活力"
  - academic_research: "學術研究"
  - minimal_modern: "簡約現代"

core_capabilities:
  - name: "多版面支援"
    layouts:
      - "標題頁"
      - "純文字"
      - "雙欄"
      - "圖片"
      - "圖表"
      - "流程圖"
      - "時間軸"
      - "比較"
  
  - name: "Chart Designer 圖表生成"
    chart_types:
      - "長條圖"
      - "圓餅圖"
      - "折線圖"
      - "雷達圖"
      - "散點圖"
  
  - name: "即時網路資料抓取"
    enabled: true
  
  - name: "高解析圖片插入"
    enabled: true
  
  - name: "Python-pptx 模板裝配"
    enabled: true
  
  - name: "品質驗證"
    checks:
      - "WCAG 對比檢查"
      - "一致性驗證"
      - "動畫策略建議"
      - "錯誤降級機制"

available_tools:
  - tool_name: "generatePresentation"
    description: "建立並儲存簡報"
    
  - tool_name: "getPresentation"
    description: "取得簡報資訊"
    
  - tool_name: "downloadPresentation"
    description: "下載簡報檔案"
    
  - tool_name: "embedPresentation"
    description: "產生分享連結"
    
  - tool_name: "deletePresentation"
    description: "移除過期簡報"

sub_agents:
  - agent_id: "agt_0697b92f782f742380000e38df5b1829"
    name: "Presentation Scenario Intelligence"
    role: "場景分析與受眾分析"
    
  - agent_id: "agt_0697af7b5e297eb68000a83f8afa5c89"
    name: "Presentation Content Strategist"
    role: "內容策略與大綱生成"
    
  - agent_id: "agt_0697afb05eb57dab8000b11c1238f946"
    name: "簡報研究分析員"
    role: "數據研究與事實檢查"
    
  - agent_id: "agt_0697af8a20b172838000e66935c302e4"
    name: "Presentation Visual Designer"
    role: "視覺設計與風格指南"
    
  - agent_id: "agt_0697afa753bf775b8000a897d906062c"
    name: "Presentation Chart Designer"
    role: "圖表設計與數據視覺化"
    
  - agent_id: "agt_0697b61771777158800088f2a50ee1b5"
    name: "Presentation Quality Assurance"
    role: "品質檢查與驗證"

workflow:
  step_1:
    name: "需求分析"
    agent: "Scenario Intelligence"
    output: "場景分類、受眾分析、目標定義"
    
  step_2:
    name: "內容策略"
    agent: "Content Strategist"
    output: "大綱結構、敘事框架、演講稿"
    
  step_3:
    name: "研究支持"
    agent: "Research Analyst"
    output: "數據收集、事實核查、引用來源"
    
  step_4:
    name: "視覺設計"
    agent: "Visual Designer"
    output: "配色方案、字型選擇、版面設計"
    
  step_5:
    name: "圖表生成"
    agent: "Chart Designer"
    output: "數據視覺化、圖表優化"
    
  step_6:
    name: "品質驗證"
    agent: "Quality Assurance"
    output: "錯誤檢查、一致性驗證、改進建議"
    
  step_7:
    name: "簡報生成"
    agent: "Orchestrator"
    output: "最終 .pptx 檔案"

use_cases:
  - "商業提案製作"
  - "專案報告生成"
  - "訓練教材開發"
  - "產品發表準備"

quality_targets:
  overall_score: 98
  consistency: 95
  visual_appeal: 96
  content_quality: 97
  technical_quality: 99

prompt_template: |
  你是 PowerPoint 簡報生成器，一個專業的簡報製作協調者。
  
  你的核心任務是：
  1. 接收使用者需求（主題、受眾、目標、風格偏好）
  2. 協調 6 個專業 Agent 完成簡報製作
  3. 確保最終輸出達到 98/100 的品質標準
  
  工作流程：
  1. 場景分析 (Scenario Intelligence)
  2. 內容策略 (Content Strategist)
  3. 研究支持 (Research Analyst)
  4. 視覺設計 (Visual Designer)
  5. 圖表生成 (Chart Designer)
  6. 品質驗證 (Quality Assurance)
  7. 最終生成與交付
  
  品質標準：
  - 內容精準且具說服力
  - 視覺設計專業一致
  - 數據圖表清晰易懂
  - 版面排版美觀協調
  - 無錯誤與不一致之處
